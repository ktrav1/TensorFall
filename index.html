<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Autumn Firefly Grove &mdash; Focused Sparkle Tracking</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        html, body {
            margin: 0; height: 100%; background: #070b18; overflow: hidden;
            font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif; color: #fff
        }
        canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block }
        #v { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none }
        #intro {
            position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 50% 45%, rgba(20, 28, 55, .45), rgba(5, 8, 18, .88));
            transition: opacity .9s
        }
        #intro.hide { opacity: 0; pointer-events: none }
        .card {
            text-align: center; max-width: 500px; margin: 0 20px; padding: 38px 42px; border-radius: 30px;
            background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16);
            -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 24px 90px rgba(0, 0, 0, .5)
        }
        .card h1 { margin: 0 0 10px; font-size: 34px; font-weight: 600 }
        .card p { margin: 0 0 22px; line-height: 1.5; color: rgba(255, 255, 255, .85); font-size: 16px }
        .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap }
        button {
            font: inherit; font-size: 16px; padding: 13px 24px; border-radius: 999px; border: 0; cursor: pointer;
            color: #1a1206; background: linear-gradient(135deg, #ffe58a, #ff9a3d); font-weight: 600; transition: transform .15s
        }
        button:hover { transform: scale(1.04) }
        button.ghost { background: rgba(255, 255, 255, .12); color: #fff; border: 1px solid rgba(255, 255, 255, .25) }
        #toast {
            position: fixed; left: 50%; top: 22px; transform: translateX(-50%) translateY(-20px); z-index: 6;
            padding: 10px 20px; border-radius: 999px; background: rgba(8, 12, 22, .8); color: #fff; font-size: 15px;
            opacity: 0; transition: all .4s; pointer-events: none; text-align: center
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0) }
        #hint {
            position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 4; font-size: 13px;
            color: rgba(255, 255, 255, .8); padding: 8px 18px; border-radius: 999px; background: rgba(8, 12, 22, .55);
            opacity: 0; transition: opacity 1s; pointer-events: none; white-space: nowrap
        }
        #hint.show { opacity: 1 }
    </style>
    <!-- Load TensorFlow.js and BodyPix -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
</head>

<body>
    <canvas id="c"></canvas>
    <video id="v" playsinline muted></video>

    <div id="intro">
        <div class="card">
            <h1>Autumn Firefly Grove</h1>
            <p>Focused Sparkle Tracking &mdash; dense, brilliant firefly swarms tightly follow your motion hotspots.</p>
            <div class="btns">
                <button id="bCam">Start Camera Stream</button>
                <button id="bMouse" class="ghost">Use Mouse / Touch</button>
            </div>
            <p class="small">Press F for fullscreen &middot; D for debug view.</p>
        </div>
    </div>
    <div id="toast"></div>
    <div id="hint">F fullscreen &nbsp;&middot;&nbsp; M mirror &nbsp;&middot;&nbsp; C switch camera &nbsp;&middot;&nbsp; D debug view</div>

    <script>
        (() => {
            'use strict';
            const $ = id => document.getElementById(id);
            const cv = $('c'), ctx = cv.getContext('2d');
            const video = $('v');
            const TAU = Math.PI * 2;
            const rand = (a, b) => a + Math.random() * (b - a);
            const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

            let W = 0, H = 0, sc = 1, dpr = 1;

            function makeGlow(h, s, l) {
                const c = document.createElement('canvas');
                c.width = c.height = 64;
                const g = c.getContext('2d');
                const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
                gr.addColorStop(0, `hsla(${h},${s}%,${l}%,1)`);
                gr.addColorStop(0.3, `hsla(${h},${s}%,${l}%,0.4)`);
                gr.addColorStop(1, `hsla(${h},${s}%,${l}%,0)`);
                g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
                return c;
            }
            const glowWarm = makeGlow(35, 100, 62);
            const glowFly = makeGlow(55, 100, 70);

            const SW = 64, SH = 36;
            const mf = new Float32Array(SW * SH);
            const trail = new Float32Array(SW * SH);
            let net = null, segmenting = false;

            let camOn = false, stream = null, mirror = true, demo = true, debug = false;

            function mfAt(X, Y) {
                const cx = (X / W * SW) | 0, cy = (Y / H * SH) | 0;
                if (cx < 0 || cy < 0 || cx >= SW || cy >= SH) return 0;
                return mf[cy * SW + cx];
            }

            function inject(X, Y, r, str) {
                const cx = X / W * SW, cy = Y / H * SH;
                const x0 = Math.max(0, Math.floor(cx - r - 1)), x1 = Math.min(SW - 1, Math.ceil(cx + r + 1));
                const y0 = Math.max(0, Math.floor(cy - r - 1)), y1 = Math.min(SH - 1, Math.ceil(cy + r + 1));
                for (let y = y0; y <= y1; y++) {
                    for (let x = x0; x <= x1; x++) {
                        const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy) / r;
                        if (d < 1) {
                            const v = str * (1 - d * d), i = y * SW + x;
                            if (v > mf[i]) mf[i] = v;
                        }
                    }
                }
            }

            async function initTensorFlow() {
                try {
                    toast('Loading TensorFlow BodyPix AI model...');
                    await tf.setBackend('webgl');
                    net = await bodyPix.load({
                        architecture: 'MobileNetV1',
                        outputStride: 16,
                        multiplier: 0.5,
                        quantBytes: 2
                    });
                    toast('AI Tracking Active!');
                } catch (e) {
                    toast('TensorFlow init failed.');
                }
            }

            async function processCamera() {
                if (!camOn || video.readyState < 2 || segmenting || !net) return;
                segmenting = true;
                try {
                    const segmentation = await net.segmentPerson(video, {
                        internalResolution: 'low',
                        segmentationThreshold: 0.65
                    });
                    
                    const data = segmentation.data;
                    for (let y = 0; y < SH; y++) {
                        for (let x = 0; x < SW; x++) {
                            const vx = Math.floor(x / SW * segmentation.width);
                            const vy = Math.floor(y / SH * segmentation.height);
                            const idx = vy * segmentation.width + vx;
                            const targetIdx = y * SW + (mirror ? SW - 1 - x : x);

                            if (data[idx] === 1) {
                                mf[targetIdx] = 1.0;
                            }
                        }
                    }
                } catch (e) {}
                segmenting = false;
            }

            const bg = document.createElement('canvas');
            const vig = document.createElement('canvas');
            let stars = [];

            function buildBackground() {
                bg.width = vig.width = cv.width;
                bg.height = vig.height = cv.height;
                const b = bg.getContext('2d');
                b.setTransform(dpr, 0, 0, dpr, 0, 0);

                const g = b.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, '#0a1230'); g.addColorStop(0.35, '#1a1f45');
                g.addColorStop(0.55, '#3a2848'); g.addColorStop(1, '#1a120f');
                b.fillStyle = g; b.fillRect(0, 0, W, H);

                stars = [];
                for (let i = 0; i < 130; i++) {
                    stars.push({ x: rand(0, W), y: rand(0, H * 0.5), r: rand(0.8, 2.4) * sc * 1.2, alpha: rand(0.3, 0.95), sp: rand(1.5, 5) });
                }

                b.globalCompositeOperation = 'lighter';
                const mx = W * 0.8, my = H * 0.2;
                const mg = b.createRadialGradient(mx, my, 0, mx, my, H * 0.55);
                mg.addColorStop(0, 'rgba(255, 238, 200, 0.4)'); mg.addColorStop(1, 'rgba(255, 210, 160, 0)');
                b.fillStyle = mg; b.fillRect(0, 0, W, H);
                b.globalCompositeOperation = 'source-over';
                b.fillStyle = '#fff3d6'; b.beginPath(); b.arc(mx, my, 40 * sc, 0, TAU); b.fill();

                const v = vig.getContext('2d');
                v.setTransform(dpr, 0, 0, dpr, 0, 0);
                const vg = v.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.hypot(W, H) * 0.58);
                vg.addColorStop(0, 'rgba(5,8,18,0)'); vg.addColorStop(1, 'rgba(5,8,18,0.5)');
                v.fillStyle = vg; v.fillRect(0, 0, W, H);
            }

            let trees = [], pumpkins = [];

            function makeTree(x, y, s) {
                const h = Math.max(0.26 * H, (y - H * 0.3) / 0.88);
                const SWd = Math.round(h * 1.7), SHt = Math.round(h * 1.35);
                const spr = document.createElement('canvas');
                spr.width = Math.round(SWd * dpr); spr.height = Math.round(SHt * dpr);
                const g = spr.getContext('2d');
                g.setTransform(dpr, 0, 0, dpr, 0, 0);
                g.fillStyle = '#4a2b17';
                g.fillRect(SWd / 2 - 6, SHt - 60, 12, 60);
                g.fillStyle = '#4f7d2b';
                g.beginPath(); g.arc(SWd / 2, SHt - 90, h * 0.35, 0, TAU); g.fill();
                return { x, y, s, h, spr, sw: SWd, sh: SHt, ph: rand(0, TAU), pop: 0 };
            }

            function makePumpkin(x, y, s) {
                return { x, y, s, r: rand(24, 38) * s * sc, face: true, ph: rand(0, TAU), pop: 0, tilt: rand(-0.08, 0.08) };
            }

            function buildGrove() {
                trees = []; pumpkins = [];
                for (let i = 0; i < 10; i++) {
                    trees.push(makeTree(rand(0.05, 0.95) * W, H * (0.58 + 0.33 * Math.random()), 1));
                }
                trees.sort((a, b) => a.y - b.y);

                for (let i = 0; i < 8; i++) {
                    pumpkins.push(makePumpkin(rand(0.04, 0.96) * W, H * (0.62 + 0.33 * Math.random()), 1));
                }
                pumpkins.sort((a, b) => a.y - b.y);
            }

            function resize() {
                dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                W = window.innerWidth; H = window.innerHeight;
                cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
                sc = Math.sqrt(W * H) / 1000;
                buildBackground(); buildGrove();
            }

            let flies = [];
            function updateFlies(dt, t) {
                // Find concentrated hotspots (center of mass / peaks) from the motion field
                let sumX = 0, sumY = 0, count = 0;
                for (let i = 0; i < mf.length; i++) {
                    if (mf[i] > 0.5) {
                        sumX += (i % SW);
                        sumY += ((i / SW) | 0);
                        count++;
                    }
                }

                // If motion is detected, spawn a dense, focused cluster of bright sparkles right around the movement center and peaks
                if (count > 5) {
                    const avgX = (sumX / count) / SW * W;
                    const avgY = (sumY / count) / SH * H;

                    // Spawn intense focused swarm around user
                    if (flies.length < 350) {
                        for (let k = 0; k < 4; k++) {
                            flies.push({
                                x: avgX + rand(-50, 50) * sc,
                                y: avgY + rand(-60, 60) * sc,
                                vx: rand(-25, 25) * sc, vy: -rand(20, 50) * sc,
                                life: rand(1.2, 2.5), max: 2.5, size: rand(4, 8.5) * sc
                            });
                        }
                    }
                }

                for (let i = flies.length - 1; i >= 0; i--) {
                    const f = flies[i];
                    f.life -= dt;
                    if (f.life <= 0) { flies.splice(i, 1); continue; }
                    f.x += f.vx * dt; f.y += f.vy * dt;
                }
            }

            function drawFlies() {
                ctx.globalCompositeOperation = 'lighter';
                for (const f of flies) {
                    const a = f.life / f.max;
                    ctx.globalAlpha = Math.min(1, a * 1.8);
                    ctx.fillStyle = '#fffae0';
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.size * 0.9, 0, TAU); ctx.fill();
                    const sz = f.size * 12;
                    ctx.drawImage(glowFly, f.x - sz / 2, f.y - sz / 2, sz, sz);
                }
                ctx.globalAlpha = 1;
                ctx.globalCompositeOperation = 'source-over';
            }

            function updateFlora(dt, t) {
                for (const tr of trees) {
                    const m = Math.max(mfAt(tr.x, tr.y - tr.h * 0.7), mfAt(tr.x, tr.y));
                    tr.pop += ((m > 0.1 ? 1 : 0) - tr.pop) * Math.min(1, dt * 10);
                }
                for (const p of pumpkins) {
                    const m = mfAt(p.x, p.y);
                    p.pop += ((m > 0.1 ? 1 : 0) - p.pop) * Math.min(1, dt * 10);
                }
            }

            function drawTree(tr) {
                ctx.drawImage(tr.spr, tr.x - tr.sw / 2, tr.y - tr.sh, tr.sw, tr.sh);
                if (tr.pop > 0.03) {
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.fillStyle = `rgba(255, 170, 50, ${tr.pop * 0.5})`;
                    ctx.beginPath(); ctx.arc(tr.x, tr.y - tr.h * 0.5, tr.h * 0.3, 0, TAU); ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';
                }
            }

            function drawPumpkin(p) {
                ctx.fillStyle = '#c2500a';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
                if (p.pop > 0.03) {
                    ctx.globalCompositeOperation = 'lighter';
                    ctx.fillStyle = `rgba(255, 210, 90, ${p.pop})`;
                    ctx.beginPath(); ctx.arc(p.x, p.y - p.r * 0.2, p.r * 0.5, 0, TAU); ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';
                }
            }

            function draw(t) {
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.drawImage(bg, 0, 0, W, H);

                for (const tr of trees) drawTree(tr);
                for (const p of pumpkins) drawPumpkin(p);
                drawFlies();

                ctx.drawImage(vig, 0, 0, W, H);

                if (debug) {
                    for (let i = 0; i < mf.length; i++) {
                        const v = mf[i], p = i * 4;
                        dimg.data[p] = 255; dimg.data[p + 1] = 220; dimg.data[p + 2] = 80; dimg.data[p + 3] = v * 255;
                    }
                    dctx.putImageData(dimg, 0, 0);
                    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(14, H - 124, 196, 112);
                    ctx.drawImage(dbg, 16, H - 122, 192, 108);
                }
            }

            let last = performance.now(), T = 0;
            const dbg = document.createElement('canvas');
            dbg.width = SW; dbg.height = SH;
            const dctx = dbg.getContext('2d');
            const dimg = dctx.createImageData(SW, SH);

            function frame(now) {
                const dt = Math.min(0.05, (now - last) / 1000);
                last = now; T += dt;

                const dec = Math.pow(0.15, dt);
                for (let i = 0; i < mf.length; i++) mf[i] *= dec;

                processCamera();
                if (demo) {
                    inject(W * (0.5 + 0.38 * Math.sin(T * 0.35)), H * (0.66 + 0.2 * Math.sin(T * 0.53 + 1)), 4, 1);
                }

                updateFlora(dt, T);
                updateFlies(dt, T);
                draw(T);
                requestAnimationFrame(frame);
            }

            const introEl = $('intro');
            function hideIntro() { introEl.classList.add('hide'); }

            async function startCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
                    video.srcObject = stream;
                    await video.play();
                    camOn = true; demo = false;
                    await initTensorFlow();
                    hideIntro();
                    toast('Focused Sparkle Tracking Active!');
                } catch (e) {
                    toast('Camera failed. Using mouse demo mode.');
                }
            }

            $('bCam').addEventListener('click', () => { startCamera(); });$('bMouse').addEventListener('click', () => { camOn = false; demo = false; hideIntro(); toast('Mouse / touch mode active'); });

            function toast(msg) {
                const t = $('toast');
                t.textContent = msg; t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            }

            window.addEventListener('pointermove', e => { if (!camOn) inject(e.clientX, e.clientY, 3.5, 1); });
            window.addEventListener('pointerdown', e => { if (!camOn) inject(e.clientX, e.clientY, 6, 1); });

            window.addEventListener('keydown', e => {
                const k = e.key.toLowerCase();
                if (k === 'f') {
                    if (document.fullscreenElement) document.exitFullscreen();
                    else document.documentElement.requestFullscreen().catch(() => {});
                } else if (k === 'd') {
                    debug = !debug;
                    toast('Debug view ' + (debug ? 'on' : 'off'));
                } else if (k === 'a') {
                    demo = !demo;
                    toast('Demo mode ' + (demo ? 'on' : 'off'));
                }
            });

            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(frame);
        })();
    </script>
</body>
</html>
